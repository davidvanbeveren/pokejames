<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #14121c; color: #ddd; font-family: ui-monospace, Menlo, monospace; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  #game { flex: 1 1 auto; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 28px 24px; box-sizing: border-box; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; box-shadow: 0 0 0 6px #2a2536, 0 0 40px rgba(138, 92, 214, 0.25); border-radius: 4px; }
  body[data-era="0"] canvas { box-shadow: 0 0 0 6px #3a3a3a; }
  body[data-era="1"] canvas { box-shadow: 0 0 0 6px #4a3a7a, 0 0 30px rgba(138, 92, 214, 0.3); }
  body[data-era="2"] canvas { box-shadow: 0 0 0 6px #5a3ab0, 0 0 60px rgba(160, 100, 255, 0.45); }
  #help { font-size: 13px; line-height: 1.7; color: #a9a4c0; padding: 10px 14px; text-align: center; user-select: none;
          max-width: 680px; }
  #help b { color: #c9c3e6; }
  #loading[hidden] { display: none; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #14121c; font-size: 14px; z-index: 5; }
  #touch { display: none; width: 100%; max-width: 480px; padding: 6px 10px 14px; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
  #touch .row { display: flex; justify-content: space-between; align-items: center; }
  .dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 2px; }
  .dpad button, .btns button, .sys button { background: #2a2536; border: 2px solid #4a4260; border-radius: 10px; color: #e8e4ff; font: bold 14px ui-monospace, monospace; touch-action: none; }
  .dpad button.down, .btns button.down, .sys button.down { background: #6a4fb0; }
  .dpad .u { grid-column: 2; grid-row: 1; } .dpad .l { grid-column: 1; grid-row: 2; } .dpad .r { grid-column: 3; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 3; }
  .btns { display: flex; gap: 14px; align-items: center; }
  .btns button { width: 60px; height: 60px; border-radius: 50%; font-size: 18px; }
  .sys { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
  .sys button { padding: 6px 16px; font-size: 12px; }
  @media (pointer: coarse) { #touch { display: block; } #help { display: none; } }
</style>
